<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Benchmark · Browser AI Image Enhancer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../demo/styles.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../"><span class="brand-mark">AI</span><span>Browser Image Enhancer</span></a>
      <nav><a href="../">Назад к приложению</a></nav>
    </header>
    <main>
      <section class="hero benchmark-hero">
        <p class="eyebrow">REPRODUCIBLE PERFORMANCE TEST</p>
        <h1>Benchmark на вашем устройстве</h1>
        <p class="hero-copy">Тест создаёт изображения 2, 8 и 15 Мп локально, прогревает модель и измеряет каждый этап через performance.now().</p>
      </section>
      <section class="benchmark-card">
        <div class="benchmark-actions">
          <div>
            <label>Backend
              <select id="backend"><option value="auto">Автоматически</option><option value="webgl2">WebGL2</option><option value="cpu">CPU</option></select>
            </label>
          </div>
          <button id="run-button" class="primary-button compact" type="button">Запустить benchmark</button>
          <button id="export-button" class="secondary-button compact" type="button" disabled>Скачать JSON</button>
        </div>
        <div id="benchmark-progress" class="progress-block hidden">
          <div class="progress-heading"><span id="benchmark-status">Подготовка</span><span id="benchmark-percent">0%</span></div>
          <div class="progress-track"><div id="benchmark-bar" class="progress-bar"></div></div>
        </div>
        <div id="summary" class="metrics-grid hidden"></div>
        <div class="table-wrap"><table><thead><tr><th>Набор</th><th>Разрешение</th><th>Backend</th><th>ML</th><th>Decode</th><th>Enhance</th><th>Encode</th><th>Total</th><th>Результат</th></tr></thead><tbody id="results"></tbody></table></div>
        <pre id="benchmark-error" class="diagnostics-output hidden"></pre>
      </section>
    </main>
    <script type="module" src="./benchmark.js"></script>
  </body>
</html>
